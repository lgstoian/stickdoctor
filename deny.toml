# cargo-deny policy. See docs/SECURITY.md for the rationale.

[advisories]
yanked = "warn"

[licenses]
confidence-threshold = 0.93
# A broad allow-list is kept so that adding a dependency does not fail CI
# merely because an entry is currently unused.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
# Workspace-internal path dependencies have no version, which cargo-deny would
# otherwise report as wildcards. They are not published, so allow them.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"